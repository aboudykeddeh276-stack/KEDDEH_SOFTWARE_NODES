name: Report 03 Engineering Qualification
on:
  pull_request:
    paths:
      - 'event_runner/**'
      - '.github/workflows/report03-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'event_runner/**'
      - '.github/workflows/report03-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resident-equivalent Report 03 qualification
        working-directory: event_runner
        run: npm run qualify
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report03-qualification
          path: |
            event_runner/evidence/REPORT03_ENGINEERING_QUALIFICATION_R2.json
            event_runner/state/qualification/evidence-ledger.jsonl
          if-no-files-found: warn
